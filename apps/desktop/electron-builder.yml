appId: com.shuvix.app
productName: ShuviX
# monorepo: electron 被 npm workspaces hoist 到仓库根 node_modules，
# electron-builder 从 apps/desktop 跑时算不出版本，这里显式钉死（与 devDependencies.electron 对应）
electronVersion: 39.8.2
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # web-tree-sitter 整包 4.4MB，其中 debug 构建 2.7MB + source map 1.2MB 从不使用
  - '!node_modules/web-tree-sitter/debug/**'
  - '!node_modules/web-tree-sitter/**/*.map'
extraResources:
  - from: resources/bundler
    to: bundler
  # CLI shim 必须以可执行文件形式落到磁盘（不能藏在 asar 里），
  # extraResources 默认就在 Resources/ 下，路径保留 +x 权限
  - from: resources/cli
    to: cli
  # workspace hoist 后 esbuild-wasm 在仓库根 node_modules
  - from: ../../node_modules/esbuild-wasm/esbuild.wasm
    to: esbuild/esbuild.wasm
  # tree-sitter 的两份 wasm（bash 命令解析）。语法包 tree-sitter-bash 是 devDependency，
  # 只在打包时取它的 wasm —— 那 6 个平台的原生预编译不进包
  - from: ../../node_modules/web-tree-sitter/web-tree-sitter.wasm
    to: tree-sitter/web-tree-sitter.wasm
  - from: ../../node_modules/tree-sitter-bash/tree-sitter-bash.wasm
    to: tree-sitter/tree-sitter-bash.wasm
asarUnpack:
  - resources/**
  - out/main/sqlWorker.js
  - out/main/cli.js
  - out/main/chunks/**
  - node_modules/@vscode/ripgrep/**
  - node_modules/esbuild-wasm/**
  - node_modules/@electric-sql/pglite/**
  - node_modules/whisper-cpp-node/**
  - node_modules/@whisper-cpp-node/**
# 启用原生模块重新编译（better-sqlite3 等）
npmRebuild: true
# 从源码编译原生模块，避免 prebuild-install 下载的预编译二进制依赖更高版本 GLIBC
buildDependenciesFromSource: true
# macOS 无开发者证书时，afterPack 钩子 fallback 到 ad-hoc 签名
afterPack: build/afterPack.cjs
win:
  executableName: shuvix
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # 公证由 CI workflow 单独步骤处理（支持重试），此处关闭 electron-builder 内置公证
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icons
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  maintainer: wangdongdongc
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: wangdongdongc
  repo: ShuviX
  releaseType: prerelease
