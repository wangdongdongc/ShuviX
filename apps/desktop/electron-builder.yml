appId: com.shuvix.app
productName: ShuviX
# monorepo: electron 被 npm workspaces hoist 到仓库根 node_modules，
# electron-builder 从 apps/desktop 跑时算不出版本，这里显式钉死（与 devDependencies.electron 对应）
electronVersion: 39.8.2
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # web-tree-sitter 整包 4.4MB，其中 debug 构建 2.7MB + source map 1.2MB 从不使用
  - '!node_modules/web-tree-sitter/debug/**'
  - '!node_modules/web-tree-sitter/**/*.map'
extraResources:
  - from: resources/bundler
    to: bundler
  # CLI shim 必须以可执行文件形式落到磁盘（不能藏在 asar 里），
  # extraResources 默认就在 Resources/ 下，路径保留 +x 权限
  - from: resources/cli
    to: cli
  # 内置 agent 档案（work / chat / coding … 的 md，一个 agent 一语言一文件）：**运行时就读这一份**
  # （agentService 按当前语言现读，见 getBuiltinAgentsDir），侧栏点内置行开的只读笔记本读的也是它 ——
  # 不再 ?raw 内联，避免「跑的是内联字符串、看的是另一份文件」
  - from: ../../packages/agent-runtime/src/subagent/builtinAgents/md
    to: builtin-agents
  # 内置安全策略（protect-credentials / ask-on-write … 的 md，一个策略一语言一文件）：**运行时就读这一份**
  # （桌面 SecurityHostProvider 的 readBuiltinPolicyMd 按当前语言现读，见 getBuiltinPoliciesDir），
  # 侧栏点内置策略行开的只读笔记本读的也是它
  - from: ../../packages/agent-runtime/src/security/builtinPolicies/md
    to: builtin-policies
  # 内置 hook（auto-title 的 md，一语言一文件）：**运行时就读这一份**（hookService 按当前语言现读，
  # 见 getBuiltinHooksDir），侧栏点内置 hook 行开的只读笔记本读的也是它
  - from: ../../packages/agent-runtime/src/hook/builtinHooks/md
    to: builtin-hooks
  # 内置知识库（ShuviX 自己的说明书，`knowledge` 工具里的保留名 `shuvix`）：一库一目录、目录下按语言分层，
  # 是真实目录而不是 ?raw 内联 —— 扫描 / 检索 / 笔记本都按目录走，与用户库同一条路
  - from: resources/knowledge
    to: knowledge
  # 内置 skills（ShuviX 自己的、按需加载的 know-how）：skills/<lang>/<name>/SKILL.md + 伴随文件。
  # 同样是真实目录 —— skillService 按目录扫描，SkillTool 返回正文时带 Base directory 头，
  # agent 再用 read 去取 references/ 下的那几份
  - from: resources/skills
    to: skills
  # workspace hoist 后 esbuild-wasm 在仓库根 node_modules
  - from: ../../node_modules/esbuild-wasm/esbuild.wasm
    to: esbuild/esbuild.wasm
  # tree-sitter 的两份 wasm（bash 命令解析）。语法包 tree-sitter-bash 是 devDependency，
  # 只在打包时取它的 wasm —— 那 6 个平台的原生预编译不进包
  - from: ../../node_modules/web-tree-sitter/web-tree-sitter.wasm
    to: tree-sitter/web-tree-sitter.wasm
  - from: ../../node_modules/tree-sitter-bash/tree-sitter-bash.wasm
    to: tree-sitter/tree-sitter-bash.wasm
asarUnpack:
  - resources/**
  - out/main/sqlWorker.js
  - out/main/cli.js
  - out/main/chunks/**
  - node_modules/@vscode/ripgrep/**
  - node_modules/esbuild-wasm/**
  - node_modules/@electric-sql/pglite/**
# 启用原生模块重新编译（better-sqlite3 等）
npmRebuild: true
# 从源码编译原生模块，避免 prebuild-install 下载的预编译二进制依赖更高版本 GLIBC
buildDependenciesFromSource: true
# macOS 无开发者证书时，afterPack 钩子 fallback 到 ad-hoc 签名
afterPack: build/afterPack.cjs
win:
  executableName: shuvix
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  # Windows 的 md 关联不走 fileAssociations：electron-builder 的 NSIS 模板会把 .md 的默认值写成
  # 自己的 ProgID（抢默认应用）。build/installer.nsh 只登记 OpenWithProgids，只进「打开方式」
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # 「用 ShuviX 打开」md：只进访达的「打开方式」列表（Alternate），不抢系统默认的 md 应用。
  # 打开后是独立的 md 窗口（markdownWindowService），不是主窗口。扩展名与 utils/markdownFiles 同一份
  fileAssociations:
    - ext: [md, markdown]
      name: Markdown
      role: Editor
      rank: Alternate
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # 公证由 CI workflow 单独步骤处理（支持重试），此处关闭 electron-builder 内置公证
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icons
  # deb 的 .desktop 声明 MimeType，出现在「打开方式」里；AppImage 不注册关联
  fileAssociations:
    - ext: [md, markdown]
      name: Markdown
      mimeType: text/markdown
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  maintainer: wangdongdongc
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
publish:
  provider: github
  owner: wangdongdongc
  repo: ShuviX
  releaseType: prerelease
