# 自动构建并发布到 GitHub Releases
# 触发条件：push 以 v 开头的 tag（如 v1.0.0）
# 验证：推到 release-ci/** 分支 —— 各平台照样构建、照样检查（含公证），但不发布（publish 只在 tag 上跑），
# 版本号用 0.0.0-ci.<运行序号>；用来在发版之前确认安装包是好的
name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-ci/**'

# 构建产物需要写入 Release 的权限
permissions:
  contents: write

jobs:
  # ---- macOS / Windows 构建 ----
  build:
    strategy:
      matrix:
        include:
          # 固定 macos-15：macos-latest 正滚动切到 macos-26 的 20260831 镜像，
          # electron-builder 26.15 的临时 keychain 导入在其上失败
          # （security set-key-partition-list → "SecKeychainUnlock: passphrase not correct"），
          # v0.1.34 / v0.1.36 的失败全是它；分到旧镜像（20260728）的 runner 才会过。
          - os: macos-15
            platform: mac
          # 固定 windows-2022：windows-latest 已迁到 windows-2025，
          # node-gyp 11 在该镜像上探测不到 VS（"Could not find any Visual Studio installation"），
          # 导致 better-sqlite3/node-pty 从源码编译失败。windows-2022 自带可被 node-gyp 识别的 VS2022。
          - os: windows-2022
            platform: win

    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERTS: ${{ secrets.APPLE_ID != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 严格按 lockfile 安装，lockfile 里被剪掉的原生依赖不会被补装，
      # 要等到 vite/electron-vite build 才炸。提前校验，报错更直白。
      - name: Verify lockfile native deps
        run: node .github/scripts/check-lockfile-natives.mjs

      - name: Install dependencies
        shell: bash
        # npm ci 拉 tarball 偶发 ECONNRESET（windows runner 尤其明显），重试 3 次。
        # npm ci 每次都会先清空 node_modules，重试是幂等的。
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci 第 $i 次失败，10s 后重试"
            sleep 10
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 一台 runner 给两个架构打包（mac：arm64 runner 打 arm64 + x64；win：x64 打 x64 + arm64），npm ci 只装
      # 本机架构的平台原生包（@vscode/ripgrep-*、@napi-rs/canvas-*）—— 补上另一个架构的，否则那个架构的包
      # 带着本机的二进制，启动即崩
      - name: Add the other architecture's platform packages
        run: node .github/scripts/add-cross-natives.mjs --os=${{ matrix.platform == 'mac' && 'darwin' || 'win32' }} --cpu=x64 --cpu=arm64

      - name: Sync version from tag
        shell: bash
        working-directory: apps/desktop
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          npm version "$V" --no-git-tag-version

      - name: Build & Sign
        working-directory: apps/desktop
        run: npx electron-vite build && npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # CSC_LINK 是 electron-builder 通用签名证书变量，不区分平台。
          # 只在 mac runner 注入 Apple Developer ID 证书；Windows 必须留空，否则
          # electron-builder 会用 Apple 证书给 setup.exe 签名，导致 electron-updater
          # 在 Windows 校验时证书链连不到受信根（Apple CA 不在 Windows 信任库），更新被拒。
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          # 构建阶段先跳过公证，由下一步单独处理（支持重试）
          MAC_NOTARIZE: false

      # 每个架构的包都得带着自己架构的平台原生包，否则不上传
      - name: Check each package carries its own platform packages
        run: node .github/scripts/check-packaged-natives.mjs apps/desktop/dist ${{ matrix.platform == 'mac' && 'darwin' || 'win32' }}

      # macOS 公证（提交后轮询结果，避免 --wait 超时导致失败）
      - name: Notarize macOS app
        if: matrix.platform == 'mac' && env.HAS_APPLE_CERTS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        working-directory: apps/desktop
        run: |
          NOTARY_ARGS="--apple-id $APPLE_ID --password $APPLE_APP_SPECIFIC_PASSWORD --team-id $APPLE_TEAM_ID"

          for dmg in dist/*.dmg; do
            echo "=== Submitting $dmg ==="
            # 提交并提取 submission ID
            SUBMIT_OUT=$(xcrun notarytool submit "$dmg" $NOTARY_ARGS 2>&1)
            echo "$SUBMIT_OUT"
            SUB_ID=$(echo "$SUBMIT_OUT" | grep '  id:' | head -1 | awk '{print $2}')
            if [ -z "$SUB_ID" ]; then
              echo "❌ Failed to get submission ID"
              exit 1
            fi
            echo "Submission ID: $SUB_ID"

            # 轮询等待结果（最多 30 分钟）
            echo "Waiting for Apple to process (up to 30 min)..."
            TIMEOUT=1800
            INTERVAL=30
            ELAPSED=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
              STATUS=$(xcrun notarytool info "$SUB_ID" $NOTARY_ARGS 2>&1 | grep '  status:' | head -1 | awk '{print $2}')
              echo "[$(( ELAPSED / 60 ))m$(( ELAPSED % 60 ))s] Status: $STATUS"
              case "$STATUS" in
                Accepted)
                  echo "✅ Notarization accepted, stapling..."
                  # 装订要连 Apple 的 CloudKit 取票据，偶尔「network connection was lost」（Error 68）：
                  # v0.2.10 / v0.2.12 / v0.2.13 都是它，公证本身已经过了 —— 重试几次再算失败
                  STAPLED=0
                  for ATTEMPT in 1 2 3 4 5; do
                    if xcrun stapler staple "$dmg"; then STAPLED=1; break; fi
                    echo "::warning::stapling $dmg failed (attempt $ATTEMPT), retrying in 20s"
                    sleep 20
                  done
                  if [ "$STAPLED" -ne 1 ]; then echo "❌ stapling $dmg failed"; exit 1; fi
                  echo "✅ $dmg done"
                  break
                  ;;
                Invalid|Rejected)
                  echo "❌ Notarization rejected. Fetching log..."
                  xcrun notarytool log "$SUB_ID" $NOTARY_ARGS
                  exit 1
                  ;;
                *)
                  # In Progress or other, keep waiting
                  ;;
              esac
            done

            if [ "$STATUS" != "Accepted" ]; then
              echo "❌ Timeout waiting for notarization of $dmg (ID: $SUB_ID)"
              echo "You can check status later: xcrun notarytool info $SUB_ID $NOTARY_ARGS"
              exit 1
            fi
          done
          echo "✅ All DMGs notarized and stapled"

      # Windows 构建多架构时会额外生成一个合并安装包（无 arch 后缀，体积翻倍），删除它
      - name: Remove universal Windows installer
        if: matrix.platform == 'win'
        shell: bash
        working-directory: apps/desktop
        run: |
          for f in dist/*-setup.exe; do
            case "$f" in *-x64-*|*-arm64-*) ;; *) echo "Removing universal: $f"; rm -f "$f" "$f.blockmap";; esac
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.yml
            !apps/desktop/dist/*.blockmap
          if-no-files-found: ignore

  # ---- Linux 构建：在 Ubuntu 20.04 Docker 中编译，glibc 2.31 兼容 Ubuntu 20.04+ ----
  # 门槛是 Ubuntu 20.04 自带的 glibc 2.31 / libstdc++ GLIBCXX_3.4.28，打包后由 check-packaged-glibc.mjs 逐个二进制验
  # 每个架构在自己架构的 runner 上原生编译（arm64 用 GitHub 的 arm64 runner，公开仓库免费）：
  # 从前一台 x64 机器打两个架构，给 arm64 编译 better-sqlite3 / node-pty 时用的还是 x64 的 gcc，arm64 包里装的
  # 是 x86-64 的模块，一启动就崩（v0.2.13 在 arm64 服务器上才看出来）。原生编译就没有「用错编译器」这回事
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux packages in Docker (glibc 2.31)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          # tag → 去掉 v 当版本号；release-ci/** 分支 → 0.0.0-ci.<运行序号>
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export TAG_VERSION="${GITHUB_REF_NAME#v}"; else export TAG_VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          # CI=true 要显式传进容器（docker 不继承 runner 的环境）：根 postinstall 见 CI 才跳过 electron-rebuild。
          # 不跳过时它不带 --build-from-source，better-sqlite3 走 prebuild-install 下上游的 Electron 预编译件
          # （GLIBC_2.34 / GLIBCXX_3.4.29），还写下 .forge-meta；electron-builder 的 @electron/rebuild 见到
          # 同架构同 ABI 的 .forge-meta 就跳过，buildDependenciesFromSource 形同虚设 —— v0.2.13 及以前的 x64 包
          # 里就是上游那份原件（sha256 一致），Ubuntu 20.04 一启动就 GLIBC_2.33 not found
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CI=true \
            -e GITHUB_TOKEN \
            -e TAG_VERSION \
            -e ARCH \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 \
            bash -c '
              set -e

              # CI 网络抖动重试帮手（最多 5 次，间隔 5s）
              retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "retry $i failed: $*"; sleep 5; done; return 1; }

              # 基础构建工具
              retry apt-get update
              apt-get install -y curl build-essential python3 fakeroot dpkg rpm git software-properties-common

              # GCC 11（Electron 39 头文件需要 <source_location>，GCC 10 不支持）
              # 不用 add-apt-repository：它走 GPG keyserver 协议拉公钥，CI 里经常
              # "retrieving gpg key timed out"。改用 HTTPS 直接拉 PPA 公钥再手动写 source。
              fetch_gcc_key() {
                curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60C317803A41BA51845E371A1E9377A2BA9EF27F" -o /tmp/gcc-ppa.key \
                  && gpg --dearmor < /tmp/gcc-ppa.key > /etc/apt/trusted.gpg.d/ubuntu-toolchain-r.gpg
              }
              retry fetch_gcc_key
              # 本机架构的编译器（x64 runner 上是 amd64，arm64 runner 上是 arm64）
              echo "deb [arch=$(dpkg --print-architecture)] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main" \
                > /etc/apt/sources.list.d/ubuntu-toolchain-r.list
              retry apt-get update
              apt-get install -y gcc-11 g++-11
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
              update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

              # 安装 Node.js 22
              retry curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh
              bash /tmp/nodesource.sh
              apt-get install -y nodejs

              # npm ci 在 workspace 根安装；构建命令在 apps/desktop 跑（配置在那里）
              node .github/scripts/check-lockfile-natives.mjs
              retry npm ci
              # 装完再验一遍 glibc：构建期工具链的预编译二进制是上游打的，
              # 上游换构建机就可能抬高门槛（rollup 4.62.3 即从 2.14 跳到 2.34），
              # 这里是 glibc 2.31 容器，不拦住就要等 electron-vite build 才炸。
              node .github/scripts/check-glibc-compat.mjs
              # 只打本机这一个架构；平台原生包 npm ci 已经按本机装好，这里只是兜底（见 add-cross-natives.mjs）
              node .github/scripts/add-cross-natives.mjs --os=linux --cpu=${ARCH}
              cd apps/desktop
              npm version "${TAG_VERSION}" --no-git-tag-version
              npx electron-vite build
              # libstdc++ 静态链进原生模块：GCC 11 的 <vector> 等头文件会引用 std::__throw_bad_array_new_length
              # （GLIBCXX_3.4.29），Ubuntu 20.04 自带的 libstdc++ 只到 3.4.28 —— 本容器里从源码编出来的
              # better-sqlite3 也照样起不来。PPA 的 libstdc++.a 是 PIC 的；--exclude-libs 把它的符号藏起来，
              # 不从各个 .node 导出。node-gyp 读环境里的 LDFLAGS，@electron/rebuild 原样传下去
              # 目标名写出来：只给 --${ARCH} 时 electron-builder 仍按 electron-builder.yml 里每个目标的 arch 列表
              # 把另一个架构也打一遍（arm64 runner 上随后去编 x64 的 better-sqlite3，gcc 不认 -m64）
              LDFLAGS="-static-libstdc++ -Wl,--exclude-libs,ALL" npx electron-builder --linux AppImage deb --${ARCH} --publish never
              # 每个架构的包都得带着自己架构的平台原生包，否则不上传
              node ../../.github/scripts/check-packaged-natives.mjs dist linux
              # 包里每个 ELF 要求的 glibc / libstdc++ 版本都不得高过 Ubuntu 20.04，否则不上传
              node ../../.github/scripts/check-packaged-glibc.mjs dist
            '
          # Docker 内创建的文件属主为 root，修正权限以便后续 upload
          sudo chown -R $(id -u):$(id -g) apps/desktop/dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.yml
          if-no-files-found: ignore

  # ---- Chrome 扩展构建：纯 Vite 产物（无原生模块），打成可「开发者模式加载」的 zip ----
  build-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile native deps
        run: node .github/scripts/check-lockfile-natives.mjs

      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci 第 $i 次失败，10s 后重试"
            sleep 10
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & zip extension
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          # manifest.version 只接受「数字.数字…」，去掉 -beta/-alpha 等预发布后缀
          CHROME_VERSION="${VERSION%%-*}"
          echo "Tag version: $VERSION  →  manifest version: $CHROME_VERSION"

          # 构建前把 tag 版本写进 manifest（public/ 会被 vite 原样拷进 dist/）
          node -e "const fs=require('fs');const f='apps/extension/public/manifest.json';const m=JSON.parse(fs.readFileSync(f));m.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')" "$CHROME_VERSION"

          npm run build:ext

          # zip 根目录必须直接是 manifest.json（不可多套一层目录）
          ( cd apps/extension/dist && zip -r "../shuvix-chrome-extension-${VERSION}.zip" . )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-extension
          path: apps/extension/*.zip
          if-no-files-found: error

  # ---- 发布阶段：所有构建完成后创建 Release 并上传全部产物 ----
  publish:
    needs: [build, build-linux, build-extension]
    # release-ci/** 分支只验证，不发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 说明正文要读 tag 之间的提交与带说明的 tag 对象：拉完整历史；checkout 在 tag 事件里会把带说明的
      # tag 换成轻量 tag（actions/checkout#290），所以再强制 fetch 一次这个 tag
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      # 本项目不走 PR，generate_release_notes 只会给出一条 Full Changelog 链接 ——
      # 正文改由 tag 说明 + 上一个 tag 以来的提交标题生成，自动生成的链接接在它后面
      - name: Build release notes
        run: node .github/scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md && cat release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 命令行安装脚本随每个 release 附上：
      # curl -fsSL https://github.com/wangdongdongc/ShuviX/releases/latest/download/install-linux.sh | bash
      - name: Attach the Linux install script
        run: |
          bash -n scripts/install-linux.sh
          cp scripts/install-linux.sh dist/install-linux.sh

      - name: List artifacts
        run: ls -lhR dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
