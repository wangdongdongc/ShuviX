# 自动构建并发布到 GitHub Releases
# 触发条件：push 以 v 开头的 tag（如 v1.0.0）
name: Release

on:
  push:
    tags:
      - 'v*'

# 构建产物需要写入 Release 的权限
permissions:
  contents: write

jobs:
  # ---- macOS / Windows 构建 ----
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          # 固定 windows-2022：windows-latest 已迁到 windows-2025，
          # node-gyp 11 在该镜像上探测不到 VS（"Could not find any Visual Studio installation"），
          # 导致 better-sqlite3/node-pty 从源码编译失败。windows-2022 自带可被 node-gyp 识别的 VS2022。
          - os: windows-2022
            platform: win

    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERTS: ${{ secrets.APPLE_ID != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 严格按 lockfile 安装，lockfile 里被剪掉的原生依赖不会被补装，
      # 要等到 vite/electron-vite build 才炸。提前校验，报错更直白。
      - name: Verify lockfile native deps
        run: node .github/scripts/check-lockfile-natives.mjs

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync version from tag
        shell: bash
        working-directory: apps/desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build & Sign
        working-directory: apps/desktop
        run: npx electron-vite build && npm run build:webui && npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # CSC_LINK 是 electron-builder 通用签名证书变量，不区分平台。
          # 只在 mac runner 注入 Apple Developer ID 证书；Windows 必须留空，否则
          # electron-builder 会用 Apple 证书给 setup.exe 签名，导致 electron-updater
          # 在 Windows 校验时证书链连不到受信根（Apple CA 不在 Windows 信任库），更新被拒。
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
          # 构建阶段先跳过公证，由下一步单独处理（支持重试）
          MAC_NOTARIZE: false

      # macOS 公证（提交后轮询结果，避免 --wait 超时导致失败）
      - name: Notarize macOS app
        if: matrix.platform == 'mac' && env.HAS_APPLE_CERTS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        working-directory: apps/desktop
        run: |
          NOTARY_ARGS="--apple-id $APPLE_ID --password $APPLE_APP_SPECIFIC_PASSWORD --team-id $APPLE_TEAM_ID"

          for dmg in dist/*.dmg; do
            echo "=== Submitting $dmg ==="
            # 提交并提取 submission ID
            SUBMIT_OUT=$(xcrun notarytool submit "$dmg" $NOTARY_ARGS 2>&1)
            echo "$SUBMIT_OUT"
            SUB_ID=$(echo "$SUBMIT_OUT" | grep '  id:' | head -1 | awk '{print $2}')
            if [ -z "$SUB_ID" ]; then
              echo "❌ Failed to get submission ID"
              exit 1
            fi
            echo "Submission ID: $SUB_ID"

            # 轮询等待结果（最多 30 分钟）
            echo "Waiting for Apple to process (up to 30 min)..."
            TIMEOUT=1800
            INTERVAL=30
            ELAPSED=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
              STATUS=$(xcrun notarytool info "$SUB_ID" $NOTARY_ARGS 2>&1 | grep '  status:' | head -1 | awk '{print $2}')
              echo "[$(( ELAPSED / 60 ))m$(( ELAPSED % 60 ))s] Status: $STATUS"
              case "$STATUS" in
                Accepted)
                  echo "✅ Notarization accepted, stapling..."
                  xcrun stapler staple "$dmg"
                  echo "✅ $dmg done"
                  break
                  ;;
                Invalid|Rejected)
                  echo "❌ Notarization rejected. Fetching log..."
                  xcrun notarytool log "$SUB_ID" $NOTARY_ARGS
                  exit 1
                  ;;
                *)
                  # In Progress or other, keep waiting
                  ;;
              esac
            done

            if [ "$STATUS" != "Accepted" ]; then
              echo "❌ Timeout waiting for notarization of $dmg (ID: $SUB_ID)"
              echo "You can check status later: xcrun notarytool info $SUB_ID $NOTARY_ARGS"
              exit 1
            fi
          done
          echo "✅ All DMGs notarized and stapled"

      # Windows 构建多架构时会额外生成一个合并安装包（无 arch 后缀，体积翻倍），删除它
      - name: Remove universal Windows installer
        if: matrix.platform == 'win'
        shell: bash
        working-directory: apps/desktop
        run: |
          for f in dist/*-setup.exe; do
            case "$f" in *-x64-*|*-arm64-*) ;; *) echo "Removing universal: $f"; rm -f "$f" "$f.blockmap";; esac
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.yml
            !apps/desktop/dist/*.blockmap
          if-no-files-found: ignore

  # ---- Linux 构建：在 Ubuntu 20.04 Docker 中编译，glibc 2.31 兼容 Ubuntu 20.04+ ----
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux packages in Docker (glibc 2.31)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          # Strip 'v' prefix for npm version
          export TAG_VERSION="${TAG_VERSION#v}"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e TAG_VERSION \
            -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:20.04 \
            bash -c '
              set -e

              # CI 网络抖动重试帮手（最多 5 次，间隔 5s）
              retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "retry $i failed: $*"; sleep 5; done; return 1; }

              # 基础构建工具
              retry apt-get update
              apt-get install -y curl build-essential python3 fakeroot dpkg rpm git software-properties-common

              # GCC 11（Electron 39 头文件需要 <source_location>，GCC 10 不支持）
              # 不用 add-apt-repository：它走 GPG keyserver 协议拉公钥，CI 里经常
              # "retrieving gpg key timed out"。改用 HTTPS 直接拉 PPA 公钥再手动写 source。
              fetch_gcc_key() {
                curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x60C317803A41BA51845E371A1E9377A2BA9EF27F" -o /tmp/gcc-ppa.key \
                  && gpg --dearmor < /tmp/gcc-ppa.key > /etc/apt/trusted.gpg.d/ubuntu-toolchain-r.gpg
              }
              retry fetch_gcc_key
              # 只取 amd64（host 编译器）；arm64 交叉编译器来自 ports.ubuntu.com，不依赖此 PPA
              echo "deb [arch=amd64] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu focal main" \
                > /etc/apt/sources.list.d/ubuntu-toolchain-r.list
              retry apt-get update
              apt-get install -y gcc-11 g++-11
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
              update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

              # 安装 Node.js 22
              retry curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh
              bash /tmp/nodesource.sh
              apt-get install -y nodejs

              # arm64 交叉编译工具链
              dpkg --add-architecture arm64
              sed -i "s/^deb /deb [arch=amd64] /" /etc/apt/sources.list
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal main restricted universe multiverse" > /etc/apt/sources.list.d/arm64.list
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-updates main restricted universe multiverse" >> /etc/apt/sources.list.d/arm64.list
              echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports focal-security main restricted universe multiverse" >> /etc/apt/sources.list.d/arm64.list
              retry apt-get update
              apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libstdc++-10-dev-arm64-cross

              # npm ci 在 workspace 根安装；构建命令在 apps/desktop 跑（配置在那里）
              node .github/scripts/check-lockfile-natives.mjs
              npm ci
              cd apps/desktop
              npm version "${TAG_VERSION}" --no-git-tag-version
              npx electron-vite build
              npm run build:webui
              npx electron-builder --linux --publish never
            '
          # Docker 内创建的文件属主为 root，修正权限以便后续 upload
          sudo chown -R $(id -u):$(id -g) apps/desktop/dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.yml
          if-no-files-found: ignore

  # ---- Chrome 扩展构建：纯 Vite 产物（无原生模块），打成可「开发者模式加载」的 zip ----
  build-extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile native deps
        run: node .github/scripts/check-lockfile-natives.mjs

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & zip extension
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # manifest.version 只接受「数字.数字…」，去掉 -beta/-alpha 等预发布后缀
          CHROME_VERSION="${VERSION%%-*}"
          echo "Tag version: $VERSION  →  manifest version: $CHROME_VERSION"

          # 构建前把 tag 版本写进 manifest（public/ 会被 vite 原样拷进 dist/）
          node -e "const fs=require('fs');const f='apps/extension/public/manifest.json';const m=JSON.parse(fs.readFileSync(f));m.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')" "$CHROME_VERSION"

          npm run build:ext

          # zip 根目录必须直接是 manifest.json（不可多套一层目录）
          ( cd apps/extension/dist && zip -r "../shuvix-chrome-extension-${VERSION}.zip" . )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-extension
          path: apps/extension/*.zip
          if-no-files-found: error

  # ---- 发布阶段：所有构建完成后创建 Release 并上传全部产物 ----
  publish:
    needs: [build, build-linux, build-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
